name: "ACU CSE 101 TA Review & Grading Action"
description: "Automated test execution, privacy-compliant PR reporting, and submission branch recording for CSE 101"
author: "Acıbadem University CSE 101 TA Team"

inputs:
  github-token:
    description: "GITHUB_TOKEN or Personal Access Token with PR comment and repo write permissions"
    required: true
  pull-request-number:
    description: "PR number when grading is dispatched from trusted course main"
    required: false
  week:
    description: "Target week to evaluate (e.g., 'week_01_intro', or 'auto' to detect from PR diff)"
    required: false
    default: "auto"
  python-version:
    description: "Python version for running tests"
    required: false
    default: "3.12"
  record-submission-branch:
    description: "Whether to provision the username branch once; existing student branches are never moved"
    required: false
    default: "false"

outputs:
  all-passed:
    description: "Whether all test cases passed ('true' or 'false')"
  passed-count:
    description: "Number of test cases passed"
  total-count:
    description: "Total number of test cases evaluated"
  detected-week:
    description: "The detected or specified week module"

runs:
  using: "node24"
  main: "dist/index.js"

branding:
  icon: "check-circle"
  color: "blue"
